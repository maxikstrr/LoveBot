<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff7ab8"/>
      <stop offset="0.55" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#5b6cff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Rounded badge -->
  <rect x="18" y="18" width="476" height="476" rx="118" fill="url(#bg)"/>
  <rect x="18" y="18" width="476" height="476" rx="118" fill="url(#glow)"/>

  <!-- subtle inner ring -->
  <circle cx="256" cy="256" r="196" fill="none" stroke="#ffffff" stroke-opacity="0.28" stroke-width="4"/>

  <!-- soft halo behind heart -->
  <circle cx="256" cy="268" r="150" fill="#ffffff" fill-opacity="0.16"/>

  <!-- main heart -->
  <path d="M256 372 C 150 296 92 224 92 162 C 92 104 136 68 190 68
           C 224 68 252 90 256 122 C 260 90 288 68 322 68
           C 376 68 420 104 420 162 C 420 224 362 296 256 372 Z"
        fill="#ffffff"/>
  <!-- heart shimmer -->
  <path d="M256 372 C 150 296 92 224 92 162 C 92 104 136 68 190 68
           C 224 68 252 90 256 122 C 260 90 288 68 322 68
           C 376 68 420 104 420 162 C 420 224 362 296 256 372 Z"
        fill="#ffd9f2" opacity="0.30" transform="translate(0 14)"/>

  <!-- sparkles -->
  <path d="M124 96 Q 124 120 100 120 Q 124 120 124 144 Q 124 120 148 120 Q 124 120 124 96 Z" fill="#ffffff"/>
  <path d="M396 356 Q 396 372 380 372 Q 396 372 396 388 Q 396 372 412 372 Q 396 372 396 356 Z" fill="#ffffff" opacity="0.95"/>
  <circle cx="126" cy="392" r="6" fill="#ffffff" opacity="0.85"/>
  <circle cx="384" cy="104" r="5" fill="#ffffff" opacity="0.75"/>
  <circle cx="396" cy="150" r="3.4" fill="#ffffff" opacity="0.6"/>
</svg>
